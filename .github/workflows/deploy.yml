name: Auto-Deploy to VPS

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Auto-Update VPS Container
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    steps:
      - name: SSH to VPS & Rebuild Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '72.62.248.38' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "==> Navigating to app directory..."
            cd /root/engos-docker

            echo "==> Pulling latest changes from GitHub main..."
            git pull origin main

            echo "==> Rebuilding and restarting containers..."
            docker compose up -d --build --remove-orphans

            echo "==> Pruning unused dangling images..."
            docker image prune -f

            echo "==> Active container status:"
            docker compose ps
