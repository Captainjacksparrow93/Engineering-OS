# ---------------------------------------------------------------------------
# Engineering OS - Hostinger VPS Traefik Deployment Configuration
# ---------------------------------------------------------------------------

services:
  db:
    container_name: engos_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engos_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-engineering_os}
    volumes:
      - engos_db_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - engos_internal_net # Isolated network - NOT exposed to internet or Traefik
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-engos} -d ${POSTGRES_DB:-engineering_os}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M

  # Runs once per deploy, before the app starts serving.
  migrate:
    container_name: engos_migrate
    image: ${APP_IMAGE:-ghcr.io/n8nmonk-wq/engineering-os:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-engos}:${POSTGRES_PASSWORD:-engos_secure_password}@db:5432/${POSTGRES_DB:-engineering_os}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - engos_internal_net
    restart: 'no'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  app:
    container_name: engos_app
    image: ${APP_IMAGE:-ghcr.io/n8nmonk-wq/engineering-os:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-engos}:${POSTGRES_PASSWORD:-engos_secure_password}@db:5432/${POSTGRES_DB:-engineering_os}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-https://engos.srv1275499.hstgr.cloud}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      NODE_ENV: production
      PORT: '3000'
    networks:
      - engos_internal_net # Talks to private PostgreSQL DB
      - n8n_default       # Joins central Traefik network for automated HTTPS
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.engos.rule=Host(`${DOMAIN:-engos.srv1275499.hstgr.cloud}`)"
      - "traefik.http.routers.engos.entrypoints=websecure"
      - "traefik.http.routers.engos.tls.certresolver=mytlschallenge"
      - "traefik.http.services.engos.loadbalancer.server.port=3000"
      - "traefik.docker.network=n8n_default"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  engos_db_data:

networks:
  engos_internal_net:
    driver: bridge
  n8n_default:
    external: true
